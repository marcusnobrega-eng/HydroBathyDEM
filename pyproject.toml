[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrobathydem"
version = "0.2.0"
description = "DEM conditioning, river bathymetry, and regular or adaptive Voronoi mesh products for flood models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Marcus Gomes"},
]
keywords = [
    "DEM",
    "DEM conditioning",
    "FABDEM",
    "raster DEM",
    "HydroPol2D",
    "river conditioning",
    "hydraulic geometry",
    "river bathymetry",
    "D4 routing",
    "FABDEM download",
    "flood modeling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "affine",
    "geopandas",
    "matplotlib",
    "netCDF4",
    "numpy",
    "pandas",
    "pyogrio",
    "pyproj",
    "rasterio",
    "scipy",
    "shapely",
    "whitebox",
]

[project.urls]
Repository = "https://github.com/marcusnobrega-eng/HydroBathyDEM"
Issues = "https://github.com/marcusnobrega-eng/HydroBathyDEM/issues"

[project.optional-dependencies]
dev = [
    "build",
]
fabdem = [
    "fabdem>=0.2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
hydrobathydem-condition-1000m = "dem_processing.run_conditioning_1000m:main"
hydrobathydem-condition = "dem_processing.condition_dem:main"
hydrobathydem-prepare-lin2020 = "dem_processing.prepare_lin2020_bankfull_geometry:main"
hydrobathydem-calibrate-hydraulics = "dem_processing.calibrate_spatial_hydraulic_geometry:main"
hydrobathydem-preflight = "dem_processing.preflight:main"
hydrobathydem-build-dem = "dem_processing.fabdem:main"
hydrobathydem-export-geometry = "dem_processing.geometry_export:main"
hydrobathydem-build-hybrid-mesh = "dem_processing.hybrid_mesh:main"
hydrobathydem-build-mesh = "dem_processing.mesh_product:main"
hydrobathydem-download-gcn250 = "dem_processing.design_hydrograph:main_download"
hydrobathydem-design-hydrograph = "dem_processing.design_hydrograph:main"
hydrobathydem-build-design-corridor = "dem_processing.design_corridor:main"
